# Netlify Configuration for Wedding Invitation
# Dr. Sayed Zain Mashhoor & Adv. Hanna Musthafa

[build]
  publish = "."

# Global Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'none';"

# Long-term Cache for Immutable Assets (Self-hosted Fonts, Images)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache for Stylesheet
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Cache for Scripts
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Cache for Config (Allows quick updates without aggressive stale caching)
[[headers]]
  for = "/config/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
