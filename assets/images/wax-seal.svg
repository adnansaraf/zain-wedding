<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="sealGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FCEFCF"/>
      <stop offset="40%" stop-color="#D4AF67"/>
      <stop offset="85%" stop-color="#997736"/>
      <stop offset="100%" stop-color="#6E5220"/>
    </radialGradient>
    <filter id="sealDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0E281C" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Wavy Organic Wax Seal Outer Rim -->
  <path d="M 50 4 C 58 4, 63 9, 71 8 C 79 7, 85 14, 91 21 C 97 28, 96 36, 98 44 C 100 52, 95 60, 93 68 C 91 76, 83 83, 76 88 C 69 93, 60 95, 52 96 C 44 97, 36 94, 28 90 C 20 86, 13 80, 9 72 C 5 64, 5 55, 4 47 C 3 39, 7 31, 12 24 C 17 17, 24 12, 32 8 C 40 4, 42 4, 50 4 Z" fill="url(#sealGold)" filter="url(#sealDrop)"/>

  <!-- Inner Embossed Ring -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="#7A5B22" stroke-width="1.5" opacity="0.75"/>
  <circle cx="50" cy="50" r="33" fill="none" stroke="#FFF" stroke-width="1" opacity="0.45"/>

  <!-- Monogram Z&H -->
  <text x="50" y="58" font-family="'Cormorant Garamond', 'Bodoni Moda', Georgia, serif" font-size="24" font-weight="600" font-style="italic" fill="#5C4215" text-anchor="middle" letter-spacing="1">Z&amp;H</text>

  <!-- Decorative Laurel Dots -->
  <circle cx="50" cy="22" r="2" fill="#5C4215" opacity="0.8"/>
  <circle cx="50" cy="78" r="2" fill="#5C4215" opacity="0.8"/>
  <circle cx="22" cy="50" r="2" fill="#5C4215" opacity="0.8"/>
  <circle cx="78" cy="50" r="2" fill="#5C4215" opacity="0.8"/>
</svg>
